# Pagina "Split Settings": la vista Lovelace "Climatizzazione" (dashboard-split) rifatta con i blocchi LEICS.
# Va in /config/www/leics/pages/split.yaml e in site.yaml (pages: e menu:). URL: /leics/split
#
# Header, navigazione, sfondo e card_mod della vista originale non servono: li fa già il pannello.
# Timer, soglie, programmi e sensoristica sono card che aprono un pop-up (components/split-popups.js).

title: Split Settings
description: clima, stagione, soglie, timer e programmi
icon: mdi:air-conditioner

# Come l'eyebrow di hacasa_page_title. {{ }} = template di Home Assistant (solo utenti amministratori).
sub: >-
  Split {{ expand('climate.soggiorno','climate.camera','climate.studio')
  | rejectattr('state','in',['off','unavailable','unknown']) | list | count }} attivi
  · {{ expand('climate.soggiorno','climate.camera','climate.studio')
  | map(attribute='attributes.current_temperature') | select('number') | list | average(0) | round(1) }}° interni

blocks:
  # ---------- riepilogo (le hacasa_metric) ----------
  - type: kpis
    items:
      - label: Attivi
        name: split accesi
        icon: mdi:air-conditioner
        value: "{{ expand('climate.soggiorno','climate.camera','climate.studio') | rejectattr('state','in',['off','unavailable','unknown']) | list | count }}"
        unit: "/ 3"
        highlight: "{{ expand('climate.soggiorno','climate.camera','climate.studio') | rejectattr('state','in',['off','unavailable','unknown']) | list | count > 0 }}"
      - label: Media
        name: temperatura interna
        icon: mdi:thermometer
        value: "{{ expand('climate.soggiorno','climate.camera','climate.studio') | map(attribute='attributes.current_temperature') | select('number') | list | average(0) | round(1) }}"
        unit: "°"
      - label: Stagione
        name: modalità automatica
        icon: mdi:weather-partly-snowy
        value: >-
          {% set e = is_state('input_boolean.on_off_estate','on') %}{% set i = is_state('input_boolean.on_off_inverno','on') %}{{ 'Estate + Inverno' if e and i else 'Estate' if e else 'Inverno' if i else 'Manuale' }}
      - label: Programmi
        name: automazioni stanze attive
        icon: mdi:robot-outline
        value: "{{ expand('input_boolean.automazioni_soggiorno','input_boolean.automazioni_camera','input_boolean.automazioni_studio') | selectattr('state','eq','on') | list | count }}"
        unit: "/ 3"

  # ---------- stagione (Estate / Inverno): tocco = accende / spegne ----------
  - type: heading
    text: Stagione
  - type: pills
    items:
      - { entity: input_boolean.on_off_estate, name: Estate, icon: mdi:weather-sunny }
      - { entity: input_boolean.on_off_inverno, name: Inverno, icon: mdi:snowflake }

  # ---------- ambienti: una card per stanza con temperatura, umidità e stato dello split.
  #            Il tocco apre il pop-up con la scheda termostato e i sensori della stanza ----------
  - type: heading
    text: Ambienti
  - { type: card, name: Soggiorno, value: "[[ sensor.stanza_temperatura | 1 ]]°", label: "[[ sensor.stanza_umidita | 0 ]]% · [[ climate.soggiorno ]]", icon: mdi:sofa, highlight: { entity: climate.soggiorno, state_not: [off, unavailable, unknown] }, tap: { popup: split, part: stanza, room: soggiorno } }
  - { type: card, name: Camera, value: "[[ sensor.stanza_temperatura_2 | 1 ]]°", label: "[[ sensor.sensore_rm4_mini_camera_humidity | 0 ]]% · [[ climate.camera ]]", icon: mdi:bed, highlight: { entity: climate.camera, state_not: [off, unavailable, unknown] }, tap: { popup: split, part: stanza, room: camera } }
  - { type: card, name: Cameretta, value: "[[ sensor.sensore_rm4_mini_studio_temperature | 1 ]]°", label: "[[ sensor.sensore_rm4_mini_studio_humidity | 0 ]]% · [[ climate.studio ]]", icon: mdi:teddy-bear, highlight: { entity: climate.studio, state_not: [off, unavailable, unknown] }, tap: { popup: split, part: stanza, room: cameretta } }
  - { type: card, name: Bagno, value: "[[ sensor.stanza_temperatura_3 | 1 ]]°", label: "[[ sensor.stanza_umidita_3 | 0 ]]% · [[ climate.termostato_bagno ]]", icon: mdi:shower, highlight: { entity: climate.termostato_bagno, state_not: [off, unavailable, unknown] }, tap: { popup: split, part: stanza, room: bagno } }
  - { type: card, name: Porte e finestre, value: "{{ ['binary_sensor.shelly_blu_door_window_dc2b_window','binary_sensor.shelly_blu_door_window_919e_window','binary_sensor.shelly_blu_door_window_17a0_window','binary_sensor.shelly_blu_door_window_adb1_window','binary_sensor.shelly_blu_door_window_2fb4_window'] | select('is_state','on') | list | count }} aperte", label: stato e batteria, icon: mdi:door, tap: { popup: split, part: contatti } }

  # ---------- temperature e soglie: pop-up che mostra Inverno o Estate secondo la stagione attiva ----------
  - type: heading
    text: Temperature e soglie
  - type: card
    name: Temperature e soglie
    value: >-
      {% set e = is_state('input_boolean.on_off_estate','on') %}{% set i = is_state('input_boolean.on_off_inverno','on') %}{{ 'Estate + Inverno' if e and i else 'Estate' if e else 'Inverno' if i else 'Manuale' }}
    label: soglie e target
    icon: mdi:thermometer-lines
    tap: { popup: split, part: temperature }

  # ---------- timer AC: tre card, il tocco apre il pop-up con i controlli (components/split-popups.js) ----------
  - type: heading
    text: Timer AC
  - { type: card, name: Timer 1, value: "{{ {'idle':'Fermo','active':'In corso','paused':'In pausa'}.get(states('timer.timer_ac_soggiorno'), states('timer.timer_ac_soggiorno')) }}", label: "[[ input_select.ac_list ]]", icon: mdi:timer-outline, highlight: { entity: timer.timer_ac_soggiorno, state: active }, tap: { popup: split, part: timer1 } }
  - { type: card, name: Timer 2, value: "{{ {'idle':'Fermo','active':'In corso','paused':'In pausa'}.get(states('timer.timer_ac_camera'), states('timer.timer_ac_camera')) }}", label: "[[ input_select.ac_list_2 ]]", icon: mdi:timer-outline, highlight: { entity: timer.timer_ac_camera, state: active }, tap: { popup: split, part: timer2 } }
  - { type: card, name: Timer 3, value: "{{ {'idle':'Fermo','active':'In corso','paused':'In pausa'}.get(states('timer.timer_ac_cameretta'), states('timer.timer_ac_cameretta')) }}", label: "[[ input_select.ac_list_3 ]]", icon: mdi:timer-outline, highlight: { entity: timer.timer_ac_cameretta, state: active }, tap: { popup: split, part: timer3 } }

  # ---------- programmi e automazioni: pop-up con automazioni per stanza e schedulazione ----------
  - type: heading
    text: Programmi e automazioni
  - type: card
    name: Programmi e automazioni
    value: "{{ expand('input_boolean.automazioni_soggiorno','input_boolean.automazioni_camera','input_boolean.automazioni_studio') | selectattr('state','eq','on') | list | count }} / 3 stanze"
    label: stanze e schedulazione
    icon: mdi:robot-outline
    highlight: { entity: input_boolean.automazione_schedulazione_attiva, state: "on" }
    tap: { popup: split, part: programmi }
  # calendario settimanale: il pop-up con l'editor è in components/split-calendario.js (helper schedule.programmazione)
  - { type: card, name: Calendario settimanale, value: "[[ schedule.programmazione ]]", label: fasce orarie, icon: mdi:calendar-week, highlight: { entity: schedule.programmazione, state: "on" }, tap: { popup: split-calendario } }
